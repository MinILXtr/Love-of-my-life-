<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Love of my life 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Great Vibes', cursive;
    }

    /* ══════════════════════════════════════════
       CANVAS — floating hearts
    ══════════════════════════════════════════ */
    #heart-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════════════════
       CANVAS — growing flowers
    ══════════════════════════════════════════ */
    #flower-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ══════════════════════════════════════════
       VIGNETTE glow edges
    ══════════════════════════════════════════ */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(
        ellipse at center,
        transparent 40%,
        rgba(120, 0, 60, 0.45) 100%
      );
    }

    /* ══════════════════════════════════════════
       TOP-LEFT LABEL
    ══════════════════════════════════════════ */
    .top-label {
      position: fixed;
      top: clamp(14px, 3vw, 28px);
      left: clamp(16px, 3vw, 32px);
      z-index: 10;
      line-height: 1.15;
    }

    .top-label .line1 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.5rem, 4.5vw, 3rem);
      color: #ff69b4;
      display: block;
      text-shadow:
        0 0 8px #ff69b4,
        0 0 20px #ff1493,
        0 0 45px rgba(255,20,147,0.6);
      animation: pulse-label 3s ease-in-out infinite;
    }

    .top-label .line2 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.75rem, 2vw, 1.1rem);
      color: #ffb6c1;
      display: block;
      letter-spacing: 3px;
      margin-top: 2px;
      text-shadow: 0 0 10px rgba(255,105,180,0.6);
      opacity: 0.9;
    }

    @keyframes pulse-label {
      0%, 100% { text-shadow: 0 0 8px #ff69b4, 0 0 20px #ff1493, 0 0 45px rgba(255,20,147,0.6); }
      50%       { text-shadow: 0 0 16px #ff1493, 0 0 40px #ff69b4, 0 0 80px rgba(255,20,147,0.8); }
    }

    /* ══════════════════════════════════════════
       PAGE WRAPPER
    ══════════════════════════════════════════ */
    .page {
      position: relative;
      z-index: 5;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(80px, 12vh, 120px) clamp(14px, 4vw, 40px) clamp(40px, 8vh, 80px);
    }

    /* ══════════════════════════════════════════
       GALLERY
    ══════════════════════════════════════════ */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(14px, 3vw, 30px);
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1000px;
    }

    /* ── Individual frame ── */
    .photo-frame {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 2.5px solid #ff69b4;
      flex-shrink: 0;

      /* responsive sizing: fills available space, capped */
      width:  clamp(200px, 26vw, 280px);
      height: clamp(250px, 33vw, 350px);

      box-shadow:
        0 0 22px rgba(255,105,180,0.65),
        0 0 55px rgba(255,20,147,0.3),
        inset 0 0 18px rgba(255,105,180,0.08);

      animation: float-frame 4.5s ease-in-out infinite;
      transition: box-shadow 0.4s;
    }

    /* center photo — slightly bigger & brighter */
    .photo-frame:nth-child(2) {
      width:  clamp(220px, 30vw, 310px);
      height: clamp(280px, 38vw, 390px);
      border-color: #ff1493;
      box-shadow:
        0 0 35px rgba(255,20,147,0.85),
        0 0 80px rgba(255,105,180,0.45),
        inset 0 0 28px rgba(255,20,147,0.12);
      animation-delay: 0.7s;
      z-index: 2;
    }

    .photo-frame:nth-child(1) { animation-delay: 0s; }
    .photo-frame:nth-child(3) { animation-delay: 1.4s; }

    @keyframes float-frame {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%       { transform: translateY(-14px) rotate(0.4deg); }
    }

    .photo-frame img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    /* Pink shimmer overlay at bottom */
    .photo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 45%,
        rgba(180, 0, 90, 0.28) 100%
      );
      pointer-events: none;
      border-radius: 20px;
    }

    /* Corner rose accent */
    .photo-frame::before {
      content: '✿';
      position: absolute;
      top: 8px; right: 10px;
      font-size: 1.1rem;
      color: rgba(255,105,180,0.55);
      pointer-events: none;
      z-index: 3;
      text-shadow: 0 0 8px #ff69b4;
    }

    /* Placeholder */
    .photo-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d000a 0%, #280018 50%, #0d000a 100%);
      color: #ff69b4;
      gap: 12px;
    }
    .photo-placeholder .ph-icon { font-size: 3rem; }
    .photo-placeholder .ph-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.82rem;
      color: #ffb6c1;
      opacity: 0.65;
      text-align: center;
      padding: 0 12px;
    }

    /* ══════════════════════════════════════════
       SPARKLE DOTS
    ══════════════════════════════════════════ */
    .sparkle {
      position: fixed;
      border-radius: 50%;
      background: #ffb6c1;
      pointer-events: none;
      z-index: 1;
      animation: sparkle-float linear infinite;
      opacity: 0;
    }
    @keyframes sparkle-float {
      0%   { transform: translateY(0) scale(0); opacity: 0; }
      15%  { opacity: 0.8; transform: scale(1); }
      85%  { opacity: 0.4; }
      100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
    }

    /* ══════════════════════════════════════════
       MOBILE — stack vertically on very narrow
    ══════════════════════════════════════════ */
    @media (max-width: 540px) {
      .gallery {
        flex-direction: column;
        gap: 20px;
      }

      .photo-frame,
      .photo-frame:nth-child(2) {
        width: min(75vw, 300px);
        height: min(90vw, 360px);
      }

      .top-label .line1 { font-size: clamp(1.6rem, 8vw, 2.4rem); }
      .top-label .line2 { font-size: clamp(0.7rem, 3.5vw, 0.95rem); }
    }

    @media (min-width: 541px) and (max-width: 820px) {
      .photo-frame,
      .photo-frame:nth-child(2) {
        width: clamp(155px, 27vw, 230px);
        height: clamp(200px, 34vw, 290px);
      }
    }

    /* ══════════════════════════════════════════
       SPLASH / CLICK-ME SCREEN
    ══════════════════════════════════════════ */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      cursor: pointer;
      transition: opacity 1.2s ease, backdrop-filter 1.2s ease;
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
    }

    #splash .splash-heart {
      font-size: clamp(3rem, 10vw, 6rem);
      animation: splash-beat 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 18px #ff1493);
      margin-bottom: 24px;
    }

    @keyframes splash-beat {
      0%, 100% { transform: scale(1);    }
      50%       { transform: scale(1.18); }
    }

    #splash .splash-text {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.4rem, 7vw, 5rem);
      color: #ff69b4;
      text-shadow:
        0 0 12px #ff69b4,
        0 0 30px #ff1493,
        0 0 60px rgba(255,20,147,0.7);
      animation: splash-glow 2s ease-in-out infinite;
      letter-spacing: 2px;
    }

    @keyframes splash-glow {
      0%, 100% { text-shadow: 0 0 12px #ff69b4, 0 0 30px #ff1493, 0 0 60px rgba(255,20,147,0.7); }
      50%       { text-shadow: 0 0 24px #ff1493, 0 0 55px #ff69b4, 0 0 100px rgba(255,20,147,0.9); }
    }

    #splash .splash-hint {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.8rem, 2.5vw, 1.1rem);
      color: #ffb6c1;
      margin-top: 16px;
      letter-spacing: 4px;
      opacity: 0.75;
      animation: fade-hint 2s ease-in-out infinite;
    }

    @keyframes fade-hint {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.9; }
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <div class="splash-heart">💗</div>
    <div class="splash-text">Click Me</div>
    <div class="splash-hint">tap anywhere to enter ✦</div>
  </div>

  <!-- Floating hearts canvas -->
  <canvas id="heart-canvas"></canvas>

  <!-- Growing flowers canvas -->
  <canvas id="flower-canvas"></canvas>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Top-left label -->
  <div class="top-label">
    <span class="line1">Love of my life</span>
    <span class="line2">— tisay 💕</span>
  </div>

  <!-- Gallery -->
  <main class="page">
    <div class="gallery">

      <div class="photo-frame">
        <img src="1000009410.jpg" alt="Photo 1"
             onerror="this.style.display='none';
                      this.parentElement.innerHTML+='<div class=\'photo-placeholder\'><span class=\'ph-icon\'>🌸</span><span class=\'ph-text\'>1000009410.jpg</span></div>'"/>
      </div>

      <div class="photo-frame">
        <img src="1000009409.jpg" alt="Photo 2"
             onerror="this.style.display='none';
                      this.parentElement.innerHTML+='<div class=\'photo-placeholder\'><span class=\'ph-icon\'>💕</span><span class=\'ph-text\'>1000009409.jpg</span></div>'"/>
      </div>

      <div class="photo-frame">
        <img src="1000010119.jpg" alt="Photo 3"
             onerror="this.style.display='none';
                      this.parentElement.innerHTML+='<div class=\'photo-placeholder\'><span class=\'ph-icon\'>🌹</span><span class=\'ph-text\'>1000010119.jpg</span></div>'"/>
      </div>

    </div>
  </main>

  <!-- MP3 Audio Player -->
  <audio id="bg-music" loop preload="auto">
    <source src="perfect.mp3" type="audio/mpeg"/>
  </audio>

  <!-- Music toggle button -->
  <button id="music-btn" title="Toggle music" style="
    display: none;
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 50;
    background: rgba(0,0,0,0.55);
    border: 2px solid #ff69b4;
    border-radius: 50%;
    width: 48px; height: 48px;
    font-size: 1.3rem;
    color: #ff69b4;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(255,105,180,0.6);
    transition: box-shadow 0.3s, transform 0.2s;
    align-items: center;
    justify-content: center;
    line-height: 1;
  ">♫</button>

  <script>
    // ── Splash dismiss + MP3 autoplay ────────────────────────────────────────
    const splash    = document.getElementById('splash');
    const music     = document.getElementById('bg-music');
    const musicBtn  = document.getElementById('music-btn');

    music.volume = 0.75;

    splash.addEventListener('click', () => {
      // Dismiss splash
      splash.classList.add('hide');
      setTimeout(() => splash.remove(), 1300);

      // Play MP3
      music.play().catch(() => {});

      // Show music button
      setTimeout(() => {
        musicBtn.style.display = 'flex';
      }, 1400);
    });

    // Pause / resume toggle
    let musicPlaying = true;
    musicBtn.addEventListener('click', () => {
      if (musicPlaying) {
        music.pause();
        musicBtn.textContent = '▶';
        musicBtn.style.boxShadow = '0 0 8px rgba(255,105,180,0.3)';
      } else {
        music.play();
        musicBtn.textContent = '♫';
        musicBtn.style.boxShadow = '0 0 16px rgba(255,105,180,0.6)';
      }
      musicPlaying = !musicPlaying;
    });

    musicBtn.addEventListener('mouseenter', () => { musicBtn.style.transform = 'scale(1.15)'; });
    musicBtn.addEventListener('mouseleave', () => { musicBtn.style.transform = 'scale(1)'; });
  </script>

  <script>
    /* ══════════════════════════════════════════
       FLOATING PINK HEARTS — CANVAS
    ══════════════════════════════════════════ */
    const canvas = document.getElementById('heart-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function heartPath(x, y, s) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.beginPath();
      ctx.moveTo(0, -0.5);
      ctx.bezierCurveTo( 0.5, -1,  1,  0.2,  0,  0.8);
      ctx.bezierCurveTo(-1,   0.2, -0.5, -1,  0, -0.5);
      ctx.closePath();
      ctx.restore();
    }

    const PINKS = [
      '#ff69b4','#ff1493','#ffb6c1',
      '#ff85c1','#f472b6','#fda4d0',
      '#e91e8c','#ff4da6'
    ];

    function mkHeart() {
      return {
        x:    Math.random() * W,
        y:    H + 10 + Math.random() * H,
        s:    5 + Math.random() * 24,
        spd:  0.45 + Math.random() * 1.6,
        dr:   (Math.random() - 0.5) * 0.7,
        al:   0.18 + Math.random() * 0.65,
        wb:   Math.random() * Math.PI * 2,
        wbs:  0.016 + Math.random() * 0.028,
        ci:   Math.floor(Math.random() * PINKS.length),
        spin: (Math.random() - 0.5) * 0.015,
        rot:  Math.random() * Math.PI * 2,
      };
    }

    const HEARTS = Array.from({ length: 80 }, mkHeart);

    function loop() {
      ctx.clearRect(0, 0, W, H);

      for (const h of HEARTS) {
        h.wb  += h.wbs;
        h.rot += h.spin;
        const wx = Math.sin(h.wb) * 18;

        // glow halo
        ctx.globalAlpha = h.al * 0.22;
        ctx.fillStyle   = PINKS[h.ci];
        ctx.shadowColor = '#ff1493';
        ctx.shadowBlur  = 28;
        heartPath(h.x + wx, h.y, h.s * 1.35);
        ctx.fill();

        // main heart
        ctx.globalAlpha = h.al;
        ctx.shadowBlur  = 12;
        heartPath(h.x + wx, h.y, h.s);
        ctx.fill();

        ctx.shadowBlur = 0;

        h.y -= h.spd;
        h.x += h.dr * 0.28;

        if (h.y < -h.s * 2.5) {
          Object.assign(h, mkHeart());
          h.y = H + h.s;
        }
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(loop);
    }

    loop();

    /* ══════════════════════════════════════════
       SPARKLE DOTS
    ══════════════════════════════════════════ */
    function addSparkle() {
      const el = document.createElement('div');
      el.className = 'sparkle';
      const size = 2 + Math.random() * 5;
      const dur  = 4 + Math.random() * 5;
      el.style.cssText = `
        left: ${Math.random() * 100}%;
        bottom: ${Math.random() * 20}%;
        width: ${size}px;
        height: ${size}px;
        animation-duration: ${dur}s;
        animation-delay: ${Math.random() * dur}s;
        background: ${PINKS[Math.floor(Math.random() * PINKS.length)]};
        box-shadow: 0 0 ${size * 2}px ${PINKS[3]};
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), (dur + 1) * 1000);
    }

    setInterval(addSparkle, 300);
  </script>

  <script>
    /* ══════════════════════════════════════════
       GROWING PINK FLOWERS — CANVAS
    ══════════════════════════════════════════ */
    const FC  = document.getElementById('flower-canvas');
    const FCX = FC.getContext('2d');
    let FW = FC.width  = window.innerWidth;
    let FH = FC.height = window.innerHeight;

    window.addEventListener('resize', () => {
      FW = FC.width  = window.innerWidth;
      FH = FC.height = window.innerHeight;
    });

    // Ease-out-back for a springy grow feel
    function easeOutBack(t) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    // Draw a single flower at (x,y) with given scale and alpha
    function drawFlower(x, y, size, alpha, petals, rot, hue) {
      if (alpha <= 0.01 || size < 1) return;
      FCX.save();
      FCX.translate(x, y);
      FCX.rotate(rot);
      FCX.globalAlpha = Math.min(1, Math.max(0, alpha));

      const pLen = size * 0.52;
      const pWid = size * 0.21;

      for (let i = 0; i < petals; i++) {
        FCX.save();
        FCX.rotate((i / petals) * Math.PI * 2);

        // Each petal: ellipse centered above origin
        const grad = FCX.createRadialGradient(0, -pLen * 0.28, 0, 0, -pLen * 0.55, pLen);
        grad.addColorStop(0,   `hsla(${hue - 15}, 95%, 88%, 1)`);
        grad.addColorStop(0.45,`hsla(${hue},      85%, 68%, 1)`);
        grad.addColorStop(1,   `hsla(${hue + 18}, 80%, 48%, 0.65)`);

        FCX.beginPath();
        FCX.ellipse(0, -pLen * 0.55, pWid, pLen, 0, 0, Math.PI * 2);
        FCX.fillStyle   = grad;
        FCX.shadowColor = `hsl(${hue}, 80%, 60%)`;
        FCX.shadowBlur  = 14;
        FCX.fill();
        FCX.restore();
      }

      // Center dot
      const cr = size * 0.14;
      const cg = FCX.createRadialGradient(0, 0, 0, 0, 0, cr);
      cg.addColorStop(0, '#fff5fa');
      cg.addColorStop(1, '#ffd6ec');
      FCX.beginPath();
      FCX.arc(0, 0, cr, 0, Math.PI * 2);
      FCX.fillStyle   = cg;
      FCX.shadowColor = '#ffb6c1';
      FCX.shadowBlur  = 10;
      FCX.fill();

      FCX.restore();
    }

    function mkFlower(existingFlowers) {
      const MIN_DIST = 160; // minimum px between flowers
      let x, y, attempts = 0;

      do {
        x = 60 + Math.random() * (FW - 120);
        y = 60 + Math.random() * (FH - 120);
        attempts++;
        // Stop trying after 80 attempts to avoid infinite loop
        if (attempts > 80) break;
      } while (
        // Stay away from photo gallery centre
        (x > FW * 0.18 && x < FW * 0.82 && y > FH * 0.22 && y < FH * 0.78) ||
        // Stay away from other flowers
        (existingFlowers && existingFlowers.some(f =>
          Math.hypot(f.x - x, f.y - y) < MIN_DIST
        ))
      );

      return {
        x, y,
        size:     20 + Math.random() * 22,              // smaller: 20–42px
        petals:   5 + Math.floor(Math.random() * 3),   // 5–7
        rot:      Math.random() * Math.PI * 2,
        spinSpd:  (Math.random() - 0.5) * 0.003,
        hue:      315 + Math.random() * 35,
        phase:    'grow',
        t:        Math.random(),
        growDur:  1.4 + Math.random() * 1.2,
        holdDur:  1.6 + Math.random() * 2.0,
        fadeDur:  1.0 + Math.random() * 0.8,
      };
    }

    // 6 flowers — well spread, not cluttered
    const FLOWERS = [];
    for (let i = 0; i < 6; i++) {
      FLOWERS.push(mkFlower(FLOWERS));
    }


    let lastFlowerTime = performance.now();

    function flowerLoop(now) {
      const dt = Math.min((now - lastFlowerTime) / 1000, 0.05);
      lastFlowerTime = now;

      FCX.clearRect(0, 0, FW, FH);

      for (const f of FLOWERS) {
        f.rot += f.spinSpd;

        // Advance time
        const dur = f.phase === 'grow' ? f.growDur
                  : f.phase === 'hold' ? f.holdDur
                  : f.fadeDur;
        f.t += dt / dur;

        if (f.t >= 1) {
          if (f.phase === 'grow') { f.phase = 'hold'; f.t = 0; }
          else if (f.phase === 'hold') { f.phase = 'fade'; f.t = 0; }
          else {
            // Respawn at new random spot, away from others
            const others = FLOWERS.filter(o => o !== f);
            Object.assign(f, mkFlower(others));
            f.phase = 'grow'; f.t = 0;
          }
        }

        let scale, alpha;
        if (f.phase === 'grow') {
          scale = easeOutBack(Math.min(f.t, 1));
          alpha = easeInOut(f.t);
        } else if (f.phase === 'hold') {
          scale = 1;
          alpha = 1;
        } else {
          // Fade: breathe out slightly then vanish
          scale = 1 + f.t * 0.18;
          alpha = 1 - easeInOut(f.t);
        }

        drawFlower(f.x, f.y, f.size * Math.max(0, scale), alpha, f.petals, f.rot, f.hue);
      }

      requestAnimationFrame(flowerLoop);
    }

    requestAnimationFrame(flowerLoop);
  </script>
</body>
</html>
